<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Mission Control &amp; CRM – FIXIA Admin</title>
<link rel="icon" type="image/svg+xml" href="logo/fixia-favicon.svg">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root {
  --bg: #0C0D12;
  --panel: #13141C;
  --panel-2: #1A1C26;
  --border: rgba(255, 255, 255, 0.09);
  --border-focus: rgba(255, 74, 28, 0.5);
  --text: #F4EFE4;
  --mute: #8E8A82;
  --hi: #FF4A1C;
  --hi-rgb: 255, 74, 28;
  --green: #10B981;
  --blue: #38BDF8;
  --yellow: #FBBF24;
  --purple: #A855F7;
  --font-sans: 'Manrope', -apple-system, BlinkMacSystemFont, sans-serif;
  --font-mono: 'JetBrains Mono', monospace;
}

* { box-sizing: border-box; margin: 0; padding: 0; }
body {
  background: var(--bg);
  color: var(--text);
  font-family: var(--font-sans);
  min-height: 100vh;
  display: flex;
  flex-direction: column;
  overflow-x: hidden;
  -webkit-font-smoothing: antialiased;
}

/* Subtle Grid Background */
body::before {
  content: '';
  position: fixed;
  inset: 0;
  background-image: 
    linear-gradient(rgba(255, 255, 255, 0.02) 1px, transparent 1px),
    linear-gradient(90deg, rgba(255, 255, 255, 0.02) 1px, transparent 1px);
  background-size: 36px 36px;
  pointer-events: none;
  z-index: 0;
}

/* Security Gate */
.gate-wrap {
  position: fixed;
  inset: 0;
  display: flex;
  align-items: center;
  justify-content: center;
  padding: 1.5rem;
  z-index: 100;
  background: radial-gradient(circle at center, rgba(255, 74, 28, 0.12), transparent 70%), var(--bg);
}
.gate-box {
  position: relative;
  width: min(420px, 100%);
  background: var(--panel);
  border: 1px solid var(--border);
  border-radius: 24px;
  padding: 2.5rem 2rem;
  box-shadow: 0 32px 80px rgba(0, 0, 0, 0.6), 0 0 0 1px rgba(255, 255, 255, 0.05);
  text-align: center;
  backdrop-filter: blur(20px);
}
.gate-logo {
  display: inline-flex;
  align-items: center;
  gap: 0.6rem;
  margin-bottom: 1.5rem;
}
.gate-logo svg { width: 36px; height: 36px; fill: #fff; }
.gate-logo span { font: 800 1.4rem var(--font-sans); letter-spacing: -0.04em; color: #fff; }
.gate-pill {
  display: inline-block;
  font: 700 0.7rem var(--font-mono);
  color: var(--hi);
  background: rgba(var(--hi-rgb), 0.14);
  border: 1px solid rgba(var(--hi-rgb), 0.3);
  padding: 0.25rem 0.75rem;
  border-radius: 999px;
  margin-bottom: 1rem;
}
.gate-box h1 { font-size: 1.6rem; letter-spacing: -0.03em; margin-bottom: 0.4rem; }
.gate-box p { color: var(--mute); font-size: 0.88rem; margin-bottom: 1.6rem; line-height: 1.4; }
.gate-form { display: flex; flex-direction: column; gap: 0.9rem; }
.gate-input-wrap { position: relative; }
.gate-input {
  width: 100%;
  background: var(--panel-2);
  border: 1px solid var(--border);
  border-radius: 14px;
  padding: 0.85rem 1rem;
  font: 600 1.05rem var(--font-mono);
  color: #fff;
  text-align: center;
  letter-spacing: 0.2em;
  outline: none;
  transition: all 0.2s;
}
.gate-input:focus {
  border-color: var(--hi);
  box-shadow: 0 0 0 3px rgba(var(--hi-rgb), 0.25);
}
.gate-btn {
  background: var(--hi);
  color: #fff;
  border: none;
  border-radius: 14px;
  padding: 0.85rem;
  font: 700 0.95rem var(--font-sans);
  cursor: pointer;
  transition: all 0.2s;
}
.gate-btn:hover { background: #E03E14; transform: translateY(-1px); }
.gate-error { color: #EF4444; font-size: 0.82rem; margin-top: 0.4rem; min-height: 1.2rem; }
.gate-hint { font: 600 0.76rem var(--font-mono); color: var(--mute); margin-top: 1rem; }

/* Admin Dashboard Container */
#adminApp {
  display: grid;
  grid-template-columns: 260px 1fr;
  min-height: 100vh;
  position: relative;
  z-index: 1;
}

/* Sidebar */
.admin-side {
  background: var(--panel);
  border-right: 1px solid var(--border);
  padding: 1.8rem 1.2rem;
  display: flex;
  flex-direction: column;
  gap: 1.8rem;
  position: sticky;
  top: 0;
  height: 100vh;
  overflow-y: auto;
}
.side-brand {
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 0 0.4rem;
}
.side-brand-left {
  display: flex;
  align-items: center;
  gap: 0.65rem;
}
.side-brand-left svg { width: 32px; height: 32px; fill: #fff; }
.side-brand-left span { font: 800 1.25rem var(--font-sans); letter-spacing: -0.04em; color: #fff; }
.side-live-badge {
  display: inline-flex;
  align-items: center;
  gap: 0.35rem;
  font: 700 0.68rem var(--font-mono);
  color: var(--green);
  background: rgba(16, 185, 129, 0.12);
  border: 1px solid rgba(16, 185, 129, 0.25);
  padding: 0.2rem 0.55rem;
  border-radius: 999px;
}
.side-live-dot {
  width: 5px;
  height: 5px;
  border-radius: 50%;
  background: var(--green);
  box-shadow: 0 0 6px var(--green);
}
.side-nav {
  display: flex;
  flex-direction: column;
  gap: 0.35rem;
}
.nav-category {
  font: 700 0.68rem var(--font-mono);
  color: var(--mute);
  text-transform: uppercase;
  letter-spacing: 0.08em;
  padding: 0.8rem 0.6rem 0.4rem;
}
.side-link {
  display: flex;
  align-items: center;
  gap: 0.75rem;
  background: none;
  border: none;
  color: #B5AFA2;
  font: 600 0.9rem var(--font-sans);
  padding: 0.65rem 0.85rem;
  border-radius: 10px;
  cursor: pointer;
  text-decoration: none;
  text-align: left;
  transition: all 0.18s;
  width: 100%;
}
.side-link:hover {
  background: rgba(255, 255, 255, 0.05);
  color: #fff;
}
.side-link.active {
  background: rgba(var(--hi-rgb), 0.14);
  color: #fff;
  border: 1px solid rgba(var(--hi-rgb), 0.3);
}
.side-link svg {
  width: 18px;
  height: 18px;
  color: inherit;
  flex-shrink: 0;
}
.side-link .badge-count {
  margin-left: auto;
  font: 700 0.72rem var(--font-mono);
  background: rgba(255, 255, 255, 0.1);
  padding: 0.15rem 0.5rem;
  border-radius: 999px;
  color: #fff;
}
.side-footer {
  margin-top: auto;
  display: flex;
  flex-direction: column;
  gap: 0.6rem;
  padding-top: 1rem;
  border-top: 1px solid var(--border);
}

/* Main Content Viewport */
.admin-main {
  padding: clamp(1.5rem, 4vw, 3rem);
  overflow-y: auto;
  max-width: 1400px;
  width: 100%;
}

/* Header Bar */
.view-header {
  display: flex;
  align-items: center;
  justify-content: space-between;
  flex-wrap: wrap;
  gap: 1.2rem;
  margin-bottom: 2rem;
}
.view-header-title h2 {
  font-size: 1.85rem;
  letter-spacing: -0.035em;
  margin-bottom: 0.25rem;
}
.view-header-title p {
  color: var(--mute);
  font-size: 0.9rem;
}
.view-header-actions {
  display: flex;
  align-items: center;
  gap: 0.65rem;
  flex-wrap: wrap;
}

/* Buttons */
.btn {
  display: inline-flex;
  align-items: center;
  gap: 0.5rem;
  background: var(--hi);
  color: #fff;
  border: none;
  border-radius: 10px;
  padding: 0.6rem 1.1rem;
  font: 600 0.88rem var(--font-sans);
  cursor: pointer;
  text-decoration: none;
  transition: all 0.2s;
}
.btn:hover { background: #E03E14; transform: translateY(-1px); }
.btn-ghost {
  background: rgba(255, 255, 255, 0.05);
  border: 1px solid var(--border);
  color: #E6DFD0;
}
.btn-ghost:hover {
  background: rgba(255, 255, 255, 0.1);
  border-color: rgba(255, 255, 255, 0.2);
}
.btn-sm {
  padding: 0.4rem 0.8rem;
  font-size: 0.8rem;
  border-radius: 8px;
}
.btn-wa {
  background: #25D366;
  color: #fff;
}
.btn-wa:hover { background: #1EBE5D; }

/* KPI Stats Cards */
.kpi-grid {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(240px, 1fr));
  gap: 1.2rem;
  margin-bottom: 2rem;
}
.kpi-card {
  background: var(--panel);
  border: 1px solid var(--border);
  border-radius: 18px;
  padding: 1.4rem;
  display: flex;
  flex-direction: column;
  gap: 0.6rem;
  transition: transform 0.2s, border-color 0.2s;
}
.kpi-card:hover {
  transform: translateY(-2px);
  border-color: rgba(255, 255, 255, 0.18);
}
.kpi-card-head {
  display: flex;
  align-items: center;
  justify-content: space-between;
  color: var(--mute);
  font: 600 0.78rem var(--font-mono);
}
.kpi-value {
  font: 800 2.2rem var(--font-sans);
  letter-spacing: -0.04em;
  color: #fff;
  line-height: 1;
}
.kpi-trend {
  display: inline-flex;
  align-items: center;
  gap: 0.3rem;
  font: 700 0.72rem var(--font-mono);
  padding: 0.15rem 0.5rem;
  border-radius: 999px;
  align-self: flex-start;
}
.trend-up { background: rgba(16, 185, 129, 0.14); color: var(--green); }
.trend-info { background: rgba(56, 189, 248, 0.14); color: var(--blue); }

/* Data Tables */
.table-card {
  background: var(--panel);
  border: 1px solid var(--border);
  border-radius: 20px;
  overflow: hidden;
  box-shadow: 0 16px 40px rgba(0, 0, 0, 0.3);
}
.table-toolbar {
  padding: 1.2rem 1.4rem;
  border-bottom: 1px solid var(--border);
  display: flex;
  align-items: center;
  justify-content: space-between;
  flex-wrap: wrap;
  gap: 1rem;
}
.search-input-wrap {
  position: relative;
  min-width: 260px;
  flex: 1;
  max-width: 400px;
}
.search-input {
  width: 100%;
  background: var(--panel-2);
  border: 1px solid var(--border);
  border-radius: 10px;
  padding: 0.55rem 0.9rem 0.55rem 2.2rem;
  font: 500 0.88rem var(--font-sans);
  color: #fff;
  outline: none;
}
.search-input:focus { border-color: var(--hi); }
.search-icon {
  position: absolute;
  left: 0.75rem;
  top: 50%;
  transform: translateY(-50%);
  color: var(--mute);
  width: 15px;
  height: 15px;
}
.table-responsive {
  width: 100%;
  overflow-x: auto;
}
table {
  width: 100%;
  border-collapse: collapse;
  font-size: 0.88rem;
  text-align: left;
}
th {
  background: var(--panel-2);
  color: var(--mute);
  font: 700 0.72rem var(--font-mono);
  text-transform: uppercase;
  letter-spacing: 0.06em;
  padding: 0.85rem 1.2rem;
  border-bottom: 1px solid var(--border);
}
td {
  padding: 1.1rem 1.2rem;
  border-bottom: 1px solid rgba(255, 255, 255, 0.05);
  vertical-align: middle;
}
tr:last-child td { border-bottom: none; }
tr:hover td { background: rgba(255, 255, 255, 0.02); }

/* Status Badges */
.status-pill {
  font: 700 0.72rem var(--font-mono);
  padding: 0.25rem 0.65rem;
  border-radius: 999px;
  display: inline-flex;
  align-items: center;
  gap: 0.35rem;
  text-transform: uppercase;
}
.status-new { background: rgba(56, 189, 248, 0.15); color: var(--blue); border: 1px solid rgba(56, 189, 248, 0.3); }
.status-contacted { background: rgba(251, 191, 36, 0.15); color: var(--yellow); border: 1px solid rgba(251, 191, 36, 0.3); }
.status-quoted { background: rgba(168, 85, 247, 0.15); color: var(--purple); border: 1px solid rgba(168, 85, 247, 0.3); }
.status-won { background: rgba(16, 185, 129, 0.15); color: var(--green); border: 1px solid rgba(16, 185, 129, 0.3); }
.status-lost { background: rgba(239, 68, 68, 0.15); color: #EF4444; border: 1px solid rgba(239, 68, 68, 0.3); }

/* Empty state */
.empty-box {
  padding: 3.5rem 1.5rem;
  text-align: center;
  color: var(--mute);
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 0.8rem;
}
.empty-icon { font-size: 2.2rem; }

/* Project Cards Grid */
.projects-grid {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(320px, 1fr));
  gap: 1.5rem;
}
.proj-admin-card {
  background: var(--panel);
  border: 1px solid var(--border);
  border-radius: 18px;
  overflow: hidden;
  display: flex;
  flex-direction: column;
  transition: transform 0.2s, border-color 0.2s;
}
.proj-admin-card:hover {
  transform: translateY(-2px);
  border-color: rgba(255, 255, 255, 0.2);
}
.proj-thumb {
  width: 100%;
  height: 180px;
  background: #09090C;
  overflow: hidden;
  position: relative;
  border-bottom: 1px solid var(--border);
}
.proj-thumb img {
  width: 100%;
  height: 100%;
  object-fit: cover;
  transition: transform 0.3s;
}
.proj-admin-card:hover .proj-thumb img { transform: scale(1.04); }
.proj-admin-content {
  padding: 1.2rem;
  display: flex;
  flex-direction: column;
  gap: 0.6rem;
  flex: 1;
}
.proj-admin-head {
  display: flex;
  align-items: center;
  justify-content: space-between;
}
.proj-admin-title { font-size: 1.15rem; font-weight: 700; color: #fff; }
.proj-admin-desc { font-size: 0.86rem; color: var(--mute); line-height: 1.45; }
.proj-admin-foot {
  margin-top: auto;
  padding-top: 0.9rem;
  border-top: 1px solid var(--border);
  display: flex;
  align-items: center;
  justify-content: space-between;
}

/* Forms */
.form-card {
  background: var(--panel);
  border: 1px solid var(--border);
  border-radius: 20px;
  padding: 1.8rem;
  max-width: 680px;
}
.form-grid {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 1.2rem;
}
.form-full { grid-column: span 2; }
.form-group {
  display: flex;
  flex-direction: column;
  gap: 0.45rem;
}
.form-label {
  font: 700 0.76rem var(--font-mono);
  color: var(--mute);
  text-transform: uppercase;
}
.form-input, .form-select, .form-textarea {
  background: var(--panel-2);
  border: 1px solid var(--border);
  border-radius: 10px;
  padding: 0.75rem 0.9rem;
  font: 500 0.9rem var(--font-sans);
  color: #fff;
  outline: none;
  width: 100%;
}
.form-input:focus, .form-select:focus, .form-textarea:focus {
  border-color: var(--hi);
}
.form-textarea { resize: vertical; min-height: 90px; }

@media (max-width: 900px) {
  #adminApp { grid-template-columns: 1fr; }
  .admin-side { height: auto; position: static; border-right: none; border-bottom: 1px solid var(--border); }
  .form-grid { grid-template-columns: 1fr; }
  .form-full { grid-column: span 1; }
}
</style>
</head>

        <span>Settings &amp; Backup</span>
      </button>
    </nav>

    <div class="side-footer">
      <a class="btn btn-ghost btn-sm" href="index.html" target="_blank" style="justify-content:center">
        <span>View Live Site</span>
        <span>↗</span>
      </a>
      <button class="btn btn-ghost btn-sm" id="logoutBtn" style="justify-content:center;color:#EF4444">
        <span>Lock Session</span>
      </button>
    </div>
  </aside>

  <!-- Main View Container -->
  <main class="admin-main" id="viewContainer">
    <!-- Injected dynamically by JS -->
  </main>
</div>

<script src="app.js?v=20261025e"></script>
<script>
(() => {
  const $ = s => document.querySelector(s);
  const $$ = s => Array.from(document.querySelectorAll(s));
  const esc = s => String(s == null ? '' : s).replace(/[&<>"']/g, c => '&#' + c.charCodeAt(0) + ';');

  const DB = {
    get: (k, def) => {
      try { return JSON.parse(localStorage.getItem(k)) ?? def; }
      catch(e) { return def; }
    },
    set: (k, v) => {
      try { localStorage.setItem(k, JSON.stringify(v)); }
      catch(e) {}
    }
  };

  // Seed sample verified leads if empty so owner sees a populated CRM
  const initLeads = () => {

  function renderLeads() {
    const leads = DB.get('fx-leads', []);

    viewContainer.innerHTML = `
      <div class="view-header">
        <div class="view-header-title">
          <h2>Client Inquiries &amp; Pipeline CRM</h2>
          <p>Review incoming project problem briefs, update proposal statuses, and message leads directly via WhatsApp.</p>
        </div>
        <div class="view-header-actions">

          <button class="btn btn-sm" id="newLeadModalBtn">+ Add Manual Lead</button>
        </div>
      </div>

      <div class="table-card">
        <div class="table-toolbar">
          <div class="search-input-wrap">
            <svg class="search-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
            <input class="search-input" id="leadSearch" type="text" placeholder="Search by name, business, or keyword...">
          </div>
          <div style="display:flex;gap:0.5rem;align-items:center">
            <span style="font:600 0.78rem var(--font-mono);color:var(--mute)">FILTER:</span>
            <select class="form-select" id="statusFilter" style="width:auto;padding:0.4rem 0.8rem;font-size:0.8rem">
              <option value="all">All Statuses (${leads.length})</option>
              <option value="new">New</option>
              <option value="contacted">Contacted</option>
              <option value="quoted">Quoted</option>
              <option value="won">Won / In Progress</option>
              <option value="lost">Lost</option>
            </select>
          </div>
        </div>

        <div class="table-responsive">
          <table id="leadsTable">
            <thead>
              <tr>
                <th>Date</th>
                <th>Client</th>
                <th>Phone / WhatsApp</th>
                <th>Brief &amp; Needs</th>
                <th>Pipeline Status</th>
                <th>Actions</th>
              </tr>
            </thead>
            <tbody id="leadsTableBody">
              <!-- Rendered by updateTable -->
            </tbody>
          </table>
        </div>
      </div>
    `;

    const tbody = $('#leadsTableBody');
    const searchInput = $('#leadSearch');
    const statusFilter = $('#statusFilter');

    function updateTable() {
      const q = searchInput.value.trim().toLowerCase();
      const st = statusFilter.value;
      const currentLeads = DB.get('fx-leads', []);

      const filtered = currentLeads.filter(l => {
        const matchesQ = !q || [l.name, l.biz, l.email, l.wa, l.focus, l.problem].some(val => (val || '').toLowerCase().includes(q));
        const matchesSt = st === 'all' || l.status === st;
        return matchesQ && matchesSt;
      });

      if (!filtered.length) {
        tbody.innerHTML = `
          <tr>
            <td colspan="6">
              <div class="empty-box">
                <div class="empty-icon">📭</div>
                <div style="font-weight:600">No matching client leads found</div>
                <div style="font-size:0.84rem">Inquiries submitted on the website contact form will appear here.</div>
              </div>
            </td>
          </tr>
        `;
        return;
      }

      tbody.innerHTML = filtered.map(l => `
        <tr>
          <td style="font:600 0.78rem var(--font-mono);color:var(--mute)">
            ${new Date(l.at || Date.now()).toLocaleDateString('en-IN', { month:'short', day:'numeric', hour:'2-digit', minute:'2-digit' })}
          </td>
          <td>
            <div style="font-weight:700;color:#fff">${esc(l.name || 'Client Lead')}</div>
            <div style="color:var(--mute);font-size:0.8rem">${esc(l.biz || 'Business')}</div>
            <div style="color:var(--blue);font-size:0.75rem">${esc(l.email || '')}</div>
          </td>
          <td>
            <div style="font:600 0.84rem var(--font-mono);color:#fff">${esc(l.wa || 'Not provided')}</div>
            <a class="btn btn-wa btn-sm" style="margin-top:0.35rem;display:inline-flex" href="https://wa.me/${encodeURIComponent((l.wa || '').replace(/[^0-9]/g, ''))}?text=${encodeURIComponent('Hi ' + (l.name || 'there') + ', this is FIXIA engineering team regarding your ' + (l.focus || 'project') + ' project.')}" target="_blank">
              WhatsApp ↗
            </a>
          </td>
          <td style="max-width:320px">
            <div style="font:700 0.8rem var(--font-mono);color:var(--hi)">${esc(l.focus || 'Custom Solution')}</div>
            <div style="color:#D4CEC0;font-size:0.84rem;margin:0.25rem 0;line-height:1.4">${esc(l.problem || 'Operational software discovery')}</div>
            <div style="font:600 0.75rem var(--font-mono);color:var(--mute)">Scope: ${esc(l.budget || 'Fixed')} · ${esc(l.timeline || 'Flexible')}</div>
          </td>
          <td>
            <select class="form-select status-select" data-id="${l.id}" style="padding:0.35rem 0.6rem;font-size:0.8rem;width:125px">
              <option value="new" ${l.status === 'new' ? 'selected' : ''}>New</option>
              <option value="contacted" ${l.status === 'contacted' ? 'selected' : ''}>Contacted</option>
              <option value="quoted" ${l.status === 'quoted' ? 'selected' : ''}>Quoted</option>
              <option value="won" ${l.status === 'won' ? 'selected' : ''}>Won / Building</option>
              <option value="lost" ${l.status === 'lost' ? 'selected' : ''}>Lost</option>
            </select>
          </td>
          <td>
            <button class="btn btn-ghost btn-sm delete-lead-btn" data-id="${l.id}" style="color:#EF4444" title="Delete Inquiry">✕</button>
          </td>
        </tr>
      `).join('');

      $$('.status-select').forEach(sel => {
        sel.onchange = () => {
          const id = Number(sel.dataset.id);
          const all = DB.get('fx-leads', []);
          const target = all.find(x => x.id === id);
          if (target) {
            target.status = sel.value;
            DB.set('fx-leads', all);
            updateBadgeCounts();
          }
        };
      });

      $$('.delete-lead-btn').forEach(btn => {
        btn.onclick = () => {
          if (confirm('Delete this inquiry?')) {
            const id = Number(btn.dataset.id);
            const remaining = DB.get('fx-leads', []).filter(x => x.id !== id);
            DB.set('fx-leads', remaining);
            updateTable();
            updateBadgeCounts();
          }
        };
      });
    }

    searchInput.oninput = updateTable;
    statusFilter.onchange = updateTable;
    updateTable();

    // Export CSV
    $('#exportCsvBtn').onclick = () => {
      const currentLeads = DB.get('fx-leads', []);
      const headers = ['Date', 'Name', 'Business', 'Email', 'WhatsApp', 'Focus', 'Problem Brief', 'Budget', 'Timeline', 'Status'];
      const rows = currentLeads.map(l => [
        l.at, l.name, l.biz, l.email, l.wa, l.focus, l.problem, l.budget, l.timeline, l.status
      ].map(x => '"' + String(x || '').replace(/"/g, '""') + '"').join(','));

      const csvContent = [headers.join(','), ...rows].join('\n');
      const blob = new Blob([csvContent], { type: 'text/csv;charset=utf-8;' });
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a');
      a.href = url;
      a.download = `fixia-leads-${new Date().toISOString().slice(0, 10)}.csv`;
      a.click();
    };

    // Manual Lead Form Modal
    $('#newLeadModalBtn').onclick = () => {
      const name = prompt('Client Name:');
      if (!name) return;
      const biz = prompt('Business Name:', 'Business Co');
      const wa = prompt('WhatsApp Number (+91...):', '+91 ');
      const focus = prompt('Service / Need (e.g. ERP, Android App, Website):', 'Custom Software');
      const problem = prompt('Problem Brief:', 'Automate daily workflow');

      const L = DB.get('fx-leads', []);
      L.unshift({
        id: Date.now(),
        at: new Date().toISOString(),
        name,
        biz,
        email: '',
        wa,
        focus,
        problem,
        budget: '₹40,000 – ₹90,000',
        timeline: '2 weeks',
        status: 'new'
      });
      DB.set('fx-leads', L);
      updateTable();
      updateBadgeCounts();
    };
  }

          <p style="color:var(--mute);font-size:0.86rem;margin-bottom:1.2rem">Set a new passcode to protect this admin panel in this browser.</p>

          <form class="form-group" id="passChangeForm">
            <label class="form-label">New Passcode (min 6 characters)</label>
            <input class="form-input" id="newPassField" type="password" placeholder="Enter new passcode" required minlength="6">
            <button class="btn btn-sm" style="margin-top:0.6rem;align-self:flex-start" type="submit">Update Passcode</button>
          </form>
        </div>

        <div class="form-card">
          <h3 style="font-size:1.2rem;margin-bottom:0.3rem">Data Backup &amp; Recovery</h3>
          <p style="color:var(--mute);font-size:0.86rem;margin-bottom:1.2rem">Download a complete JSON snapshot of all client leads, inquiries, and custom projects.</p>

          <div style="display:flex;flex-direction:column;gap:0.75rem">
            <button class="btn btn-ghost btn-sm" id="exportAllDataBtn">📥 Export Complete Database (JSON)</button>
            <button class="btn btn-ghost btn-sm" id="clearDataBtn" style="color:#EF4444">⚠️ Reset CRM to Default Sample Data</button>
          </div>
        </div>

        <div class="form-card" style="grid-column:span 2">
          <h3 style="font-size:1.2rem;margin-bottom:0.3rem">Production Environment Status</h3>
          <p style="color:var(--mute);font-size:0.86rem;margin-bottom:1.2rem">Verified deployment parameters for FIXIA website.</p>

          <div style="display:grid;grid-template-columns:repeat(3, 1fr);gap:1rem">
            <div style="background:var(--panel-2);padding:1rem;border-radius:12px;border:1px solid var(--border)">
              <div style="font:700 0.7rem var(--font-mono);color:var(--mute)">PRODUCTION DOMAIN</div>
              <div style="font:700 0.95rem var(--font-mono);color:var(--blue);margin-top:0.3rem">www.fixia.in</div>
            </div>

            <div style="background:var(--panel-2);padding:1rem;border-radius:12px;border:1px solid var(--border)">
              <div style="font:700 0.7rem var(--font-mono);color:var(--mute)">HOSTING &amp; CI/CD</div>
              <div style="font:700 0.95rem var(--font-mono);color:var(--green);margin-top:0.3rem">Vercel Edge Platform</div>
            </div>

            <div style="background:var(--panel-2);padding:1rem;border-radius:12px;border:1px solid var(--border)">
              <div style="font:700 0.7rem var(--font-mono);color:var(--mute)">GIT REPOSITORY</div>
              <div style="font:700 0.95rem var(--font-mono);color:#fff;margin-top:0.3rem">sumit07122/Fixia</div>
            </div>
          </div>
        </div>
      </div>
    `;

    $('#passChangeForm').onsubmit = e => {
      e.preventDefault();
      const newP = $('#newPassField').value.trim();
      if (newP.length >= 6) {
        DB.set('fx-admin-pass', newP);
        alert('Passcode successfully changed!');
        $('#newPassField').value = '';
      }
    };

    $('#exportAllDataBtn').onclick = () => {
      const data = {
        exportedAt: new Date().toISOString(),
        leads: DB.get('fx-leads', []),
        customProjects: DB.get('fx-custom-projects', [])
      };
      const blob = new Blob([JSON.stringify(data, null, 2)], { type: 'application/json' });
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a');
      a.href = url;
      a.download = `fixia-backup-${new Date().toISOString().slice(0, 10)}.json`;
      a.click();
    };

    $('#clearDataBtn').onclick = () => {
      if (confirm('Are you sure you want to reset all CRM leads?')) {
        localStorage.removeItem('fx-leads');
        localStorage.removeItem('fx-custom-projects');
        initLeads();
        alert('CRM reset to fresh sample data.');
        renderDashboard();
      }
    };
  }

})();
</script>
</body>
</html>
