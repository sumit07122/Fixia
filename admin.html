<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1"><meta name="robots" content="noindex"><title>Admin – FIXIA</title>
<link rel="icon" type="image/svg+xml" href="logo/fixia-favicon.svg">
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&family=Instrument+Serif:ital@0;1&display=swap" rel="stylesheet"><link rel="stylesheet" href="styles.css?v=20261025d">
<style>body{animation:none;overflow:auto}.gate{min-height:100vh;display:grid;place-items:center;padding:1.5rem}.gate form{background:#fff;border:1.5px solid var(--ink);border-radius:24px;padding:2rem;width:min(380px,100%);display:grid;gap:.8rem}
.gate svg,.side svg{width:2rem;height:2rem;fill:var(--ink)}.gate circle,.side circle{fill:var(--hi)}input,select,textarea{font:inherit;padding:.7rem .9rem;border:1.5px solid var(--line);border-radius:12px;background:#fff;width:100%}
#app{display:grid;grid-template-columns:220px 1fr;min-height:100vh}.side{background:var(--ink);color:#fff;padding:1.4rem;display:flex;flex-direction:column;gap:.4rem;position:sticky;top:0;height:100vh}
.side b{font:800 1.3rem var(--display);letter-spacing:-.05em;display:flex;gap:.5rem;align-items:center;margin-bottom:1rem}.side svg{fill:#fff}.side button,.side a{background:none;border:0;color:#B5AFA2;text-align:left;padding:.6rem .8rem;border-radius:10px;text-decoration:none;font-weight:600}
.side button.on,.side button:hover{background:rgba(255,255,255,.1);color:#fff}.side a{margin-top:auto}.main{padding:clamp(1.2rem,3vw,2.5rem);overflow:auto}h1{font-size:2rem;margin-bottom:1.2rem}
.cards{display:grid;grid-template-columns:repeat(4,1fr);gap:1rem}.cards div,.box{background:#fff;border:1px solid var(--line);border-radius:18px;padding:1.2rem}.cards b{display:block;font:800 2.4rem var(--display);letter-spacing:-.05em}
table{width:100%;border-collapse:collapse;background:#fff;border-radius:16px;overflow:hidden;font-size:.9rem}th,td{text-align:left;padding:.7rem .8rem;border-bottom:1px solid var(--line);vertical-align:top}th{font:700 .72rem var(--mono);text-transform:uppercase;background:var(--paper2)}
.bar{display:flex;gap:.6rem;flex-wrap:wrap;margin-bottom:1rem}.bar input{max-width:280px}.g{display:grid;gap:.6rem;max-width:480px}.empty{color:var(--mute);padding:1.5rem;background:#fff;border-radius:16px}
@media(max-width:800px){#app{grid-template-columns:1fr}.side{position:static;height:auto;flex-direction:row;flex-wrap:wrap}.cards{grid-template-columns:1fr 1fr}table{display:block;overflow:auto}}</style></head><body>
<div class="gate" id="gate"><form id="gf"><svg viewBox="0 0 40 40"><path d="M8 5h24v7H15v23H8z"/><circle cx="26" cy="25" r="6.5"/></svg><h1 id="gt" style="margin:0">FIXIA admin</h1><p id="gm" style="color:var(--mute)"></p><input id="pw" type="password" placeholder="Passcode" autocomplete="off"><button class="btn" type="submit">Enter</button></form></div>
<div id="app" hidden><aside class="side"><b><svg viewBox="0 0 40 40"><path d="M8 5h24v7H15v23H8z"/><circle cx="26" cy="25" r="6.5"/></svg>FIXIA</b><button data-v="ov" class="on">Overview</button><button data-v="ld">Leads</button><button data-v="pj">Projects</button><button data-v="st">Settings</button><a href="index.html">← View site</a></aside><main class="main" id="v"></main></div>
<script>
const $=s=>document.querySelector(s),e=s=>String(s==null?'':s).replace(/[&<>"']/g,c=>'&#'+c.charCodeAt(0)+';'),J=(k,d)=>{try{return JSON.parse(localStorage.getItem(k)||d)}catch(x){return JSON.parse(d)}},W=(k,v)=>{try{localStorage.setItem(k,JSON.stringify(v))}catch(x){}};
const H=s=>{let h=5381;for(const c of s)h=(h*33^c.charCodeAt(0))>>>0;return String(h)},ST=['new','contacted','quoted','won','lost'];let view='ov';
const has=!!J('fx-pass','""');$('#gm').textContent=has?'Enter your passcode.':'First visit: choose a passcode.';$('#gt').textContent=has?'FIXIA admin':'Set passcode';
const open=()=>{$('#gate').hidden=true;$('#app').hidden=false;try{sessionStorage.fxa=1}catch(x){}draw()};
$('#gf').onsubmit=ev=>{ev.preventDefault();const p=$('#pw').value;if(p.length<4)return $('#gm').textContent='Use at least 4 characters.';if(!has){W('fx-pass',H(p));return open()}H(p)===J('fx-pass','""')?open():$('#gm').textContent='Wrong passcode.'};
try{if(sessionStorage.fxa&&has)open()}catch(x){}
document.querySelector('.side').onclick=ev=>{const b=ev.target.closest('button');if(!b)return;view=b.dataset.v;document.querySelectorAll('.side button').forEach(x=>x.classList.toggle('on',x===b));draw()};
const csv=L=>L.map(l=>[l.at,l.name,l.biz,l.email,l.wa,l.focus,l.budget,l.problem,l.status].map(x=>'"'+String(x||'').replace(/"/g,'""')+'"').join(',')).join('\n');
const dl=(n,t)=>{const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([t]));a.download=n;a.click()};
function draw(){const L=J('fx-leads','[]'),P=J('fx-projects','[]'),v=$('#v');
if(view=='ov')v.innerHTML=`<h1>Overview</h1><div class="cards">${[['Total leads',L.length],['New',L.filter(l=>l.status=='new').length],['Quoted',L.filter(l=>l.status=='quoted').length],['Won',L.filter(l=>l.status=='won').length]].map(([a,b])=>`<div><small>${a}</small><b>${b}</b></div>`).join('')}</div><h2 style="font-size:1.4rem;margin:2rem 0 .8rem">Latest leads</h2>${L.length?L.slice(0,5).map(l=>`<div class="box" style="margin-bottom:.6rem"><b>${e(l.name)}</b> · ${e(l.biz)}<br><span style="color:var(--mute)">${e(l.problem).slice(0,140)}</span></div>`).join(''):'<div class="empty">No leads yet. They appear here when someone submits the contact form in this browser. Add a demo lead from the Leads tab to try it.</div>'}`;
if(view=='ld'){v.innerHTML=`<h1>Leads</h1><div class="bar"><input id="q" placeholder="Search leads"><button class="btn sm" id="ex">Export CSV</button><button class="btn ghost sm" id="demo">Add demo lead</button></div><div id="tb"></div>`;const t=()=>{const q=$('#q').value.toLowerCase(),R=L.filter(l=>JSON.stringify(l).toLowerCase().includes(q));$('#tb').innerHTML=R.length?`<table><tr><th>Date</th><th>Lead</th><th>Contact</th><th>Brief</th><th>Status</th><th></th></tr>${R.map(l=>`<tr><td>${e(l.at.slice(0,10))}</td><td><b>${e(l.name)}</b><br>${e(l.biz)}</td><td>${e(l.wa)}<br>${e(l.email)}</td><td>${e(l.focus)}<br><span style="color:var(--mute)">${e(l.problem).slice(0,120)}<br>${e(l.budget)}</span></td><td><select data-s="${l.id}">${ST.map(s=>`<option${s==l.status?' selected':''}>${s}</option>`).join('')}</select></td><td><button data-d="${l.id}" class="btn ghost sm">Delete</button></td></tr>`).join('')}</table>`:'<div class="empty">No leads match.</div>'};t();$('#q').oninput=t;
$('#ex').onclick=()=>dl('fixia-leads.csv','date,name,business,email,whatsapp,focus,budget,problem,status\n'+csv(L));$('#demo').onclick=()=>{L.unshift({id:Date.now(),at:new Date().toISOString(),name:'Demo Client',biz:'Demo Co',email:'demo@example.com',wa:'+91 00000 00000',focus:'Performance ads',problem:'We need more qualified leads from Instagram.',budget:'₹60,000 – ₹1,50,000 (Build Tier)',status:'new'});W('fx-leads',L);draw()};
$('#tb').onchange=ev=>{const s=ev.target.dataset.s;if(s){L.find(l=>l.id==s).status=ev.target.value;W('fx-leads',L)}};$('#tb').onclick=ev=>{const d=ev.target.dataset.d;if(d&&confirm('Delete this lead?')){W('fx-leads',L.filter(l=>l.id!=d));draw()}}}
if(view=='pj'){v.innerHTML=`<h1>Projects</h1><p style="color:var(--mute);margin-bottom:1rem">The 7 built-in projects live in app.js. Projects added here appear on the Work page in this browser.</p><form class="box g" id="pf"><input id="pt" placeholder="Project name" required><input id="pu" placeholder="https://live-site.com" required><input id="pc" placeholder="Category e.g. Real Estate" required><input id="pi" placeholder="Screenshot path e.g. assets/projects/name-desktop.webp"><textarea id="pd" rows="3" placeholder="One-line description" required></textarea><button class="btn sm" style="justify-self:start">Add project</button></form><h2 style="font-size:1.4rem;margin:1.6rem 0 .8rem">Added by you</h2>${P.length?P.map(p=>`<div class="box" style="margin-bottom:.6rem;display:flex;justify-content:space-between;gap:1rem"><span><b>${e(p.title)}</b> · ${e(p.category)}<br><span style="color:var(--mute)">${e(p.url)}</span></span><button class="btn ghost sm" data-x="${e(p.id)}">Remove</button></div>`).join(''):'<div class="empty">Nothing added yet.</div>'}`;
$('#pf').onsubmit=ev=>{ev.preventDefault();let d=$('#pu').value;try{d=new URL(d).hostname}catch(x){}const t=$('#pd').value;P.push({id:'c'+Date.now(),title:$('#pt').value,client:$('#pt').value,url:$('#pu').value,domain:d,category:$('#pc').value,categorySlug:'custom',featured:false,tagline:t,shortDesc:t,desktopImg:$('#pi').value,mobileImg:'',overview:t,challenge:'',whatWeBuilt:[t],result:'',tags:[$('#pc').value]});W('fx-projects',P);draw()};v.onclick=ev=>{const x=ev.target.dataset.x;if(x){W('fx-projects',P.filter(p=>p.id!=x));draw()}}}
if(view=='st'){v.innerHTML=`<h1>Settings</h1><div class="box g"><b>Change passcode</b><input id="np" type="password" placeholder="New passcode"><button class="btn sm" id="sp" style="justify-self:start">Save</button><hr><b>Data</b><button class="btn ghost sm" id="bk" style="justify-self:start">Export everything (JSON)</button><button class="btn ghost sm" id="rs" style="justify-self:start">Delete all leads and projects</button><p style="color:var(--mute);font-size:.88rem">Heads up: this panel stores data in this browser only, and the passcode is a convenience lock, not real security. To receive leads from every visitor and protect the panel properly, connect a backend (Supabase, Firebase or a Google Sheet).</p></div>`;
$('#sp').onclick=()=>{const p=$('#np').value;if(p.length>=4){W('fx-pass',H(p));alert('Passcode updated')}};$('#bk').onclick=()=>dl('fixia-data.json',JSON.stringify({leads:L,projects:P}));$('#rs').onclick=()=>{if(confirm('Delete all leads and added projects?')){W('fx-leads',[]);W('fx-projects',[]);draw()}}}}
</script></body></html>
