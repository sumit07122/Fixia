<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>404 · Page Not Located – FIXIA</title>
<meta name="description" content="The page or blueprint you are searching for does not exist or has been shifted in the FIXIA architecture.">
<link rel="icon" type="image/svg+xml" href="logo/fixia-favicon.svg">
<link rel="manifest" href="manifest.webmanifest">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600;700&display=swap" rel="stylesheet">

<link rel="stylesheet" href="polish.css?v=20261025d">
<style>
:root {
  --e-bg: #0C0D12;
  --e-panel: #13141C;
  --e-panel-2: #1A1C28;
  --e-border: rgba(255, 255, 255, 0.08);
  --e-hi: #FF4A1C;
  --e-hi-rgb: 255, 74, 28;
  --e-mute: #8E8A82;
  --e-text: #F4EFE4;
}

body {
  background: var(--e-bg);
  color: var(--e-text);
  font-family: 'Manrope', -apple-system, BlinkMacSystemFont, sans-serif;
  min-height: 100vh;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  padding: 1.5rem;
  position: relative;
  overflow-x: hidden;
  text-align: center;
}

/* Background grid */
body::before {
  content: '';
  position: fixed;
  inset: 0;
  background-image: 
    linear-gradient(rgba(255, 255, 255, 0.02) 1px, transparent 1px),
    linear-gradient(90deg, rgba(255, 255, 255, 0.02) 1px, transparent 1px);
  background-size: 40px 40px;
  pointer-events: none;
  z-index: 0;
}

/* Glowing background orb */
.bg-glow {
  position: fixed;
  width: 500px;
  height: 500px;
  border-radius: 50%;
  background: radial-gradient(circle, rgba(var(--e-hi-rgb), 0.15) 0%, transparent 70%);
  top: 50%;
  left: 50%;
  transform: translate(-50%, -50%);
  pointer-events: none;
  z-index: 0;
}

.err-box {
  position: relative;
  z-index: 1;
  max-width: 620px;
  width: 100%;
  background: rgba(19, 20, 28, 0.85);
  border: 1px solid var(--e-border);
  border-radius: 28px;
  padding: clamp(2rem, 5vw, 3.5rem);
  box-shadow: 0 40px 100px -20px rgba(0, 0, 0, 0.8), 0 0 0 1px rgba(255, 255, 255, 0.05);
  backdrop-filter: blur(24px);
  -webkit-backdrop-filter: blur(24px);
}

.err-badge {
  display: inline-flex;
  align-items: center;
  gap: 0.45rem;
  font: 700 0.72rem 'JetBrains Mono', monospace;
  color: var(--e-hi);
  background: rgba(var(--e-hi-rgb), 0.12);
  border: 1px solid rgba(var(--e-hi-rgb), 0.28);
  padding: 0.3rem 0.85rem;
  border-radius: 999px;
  margin-bottom: 1.5rem;
  text-transform: uppercase;
  letter-spacing: 0.08em;
}
.err-dot {
  width: 6px;
  height: 6px;
  border-radius: 50%;
  background: var(--e-hi);
  box-shadow: 0 0 8px var(--e-hi);
}

.err-code {
  font: 800 clamp(4.5rem, 12vw, 7.5rem)/0.9 'Manrope', sans-serif;
  letter-spacing: -0.06em;
  background: linear-gradient(180deg, #FFFFFF 30%, rgba(255, 255, 255, 0.3) 100%);
  -webkit-background-clip: text;
  -webkit-text-fill-color: transparent;
  margin-bottom: 0.8rem;
}

.err-title {
  font-size: clamp(1.4rem, 3vw, 1.85rem);
  font-weight: 700;
  letter-spacing: -0.03em;
  margin-bottom: 0.8rem;
  color: #fff;
}

.err-desc {
  font-size: 0.96rem;
  line-height: 1.6;
  color: var(--e-mute);
  margin-bottom: 2.2rem;
  max-width: 460px;
  margin-left: auto;
  margin-right: auto;
}

.quick-links {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(130px, 1fr));
  gap: 0.65rem;
  margin-bottom: 2rem;
}
.quick-link-item {
  background: var(--e-panel-2);
  border: 1px solid var(--e-border);
  border-radius: 12px;
  padding: 0.8rem 0.7rem;
  text-decoration: none;
  color: #DDD7CB;
  font: 600 0.84rem 'JetBrains Mono', monospace;
  transition: all 0.2s;
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 0.4rem;
}
.quick-link-item:hover {
  background: rgba(255, 255, 255, 0.08);
  border-color: rgba(255, 255, 255, 0.22);
  color: #fff;
  transform: translateY(-2px);
}

.btn-row {
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 0.8rem;
  flex-wrap: wrap;
}
.btn-primary {
  background: var(--e-hi);
  color: #fff;
  padding: 0.85rem 1.6rem;
  border-radius: 12px;
  font-weight: 700;
  font-size: 0.92rem;
  text-decoration: none;
  transition: all 0.2s;
  display: inline-flex;
  align-items: center;
  gap: 0.5rem;
}
.btn-primary:hover {
  background: #E03E14;
  transform: translateY(-1px);
  box-shadow: 0 10px 24px rgba(var(--e-hi-rgb), 0.35);
}
.btn-ghost-err {
  background: rgba(255, 255, 255, 0.05);
  border: 1px solid var(--e-border);
  color: #E6DFD0;
  padding: 0.85rem 1.4rem;
  border-radius: 12px;
  font-weight: 600;
  font-size: 0.92rem;
  text-decoration: none;
  transition: all 0.2s;
}
.btn-ghost-err:hover {
  background: rgba(255, 255, 255, 0.1);
  border-color: rgba(255, 255, 255, 0.2);
  color: #fff;
}
</style>
</head>
<body data-page="404">

<div class="bg-glow"></div>

<div class="err-box">
  <div class="err-badge">
    <div class="err-dot"></div>
    <span>HTTP STATUS · 404 NOT FOUND</span>
  </div>

  <div class="err-code">404</div>
  <h1 class="err-title">Blueprint Not Located</h1>
  <p class="err-desc">
    The URL you requested does not map to any active production endpoint or case study. It may have been refactored or moved.
  </p>

  <div class="quick-links">
    <a class="quick-link-item" href="index.html"><span>🏠</span> Home</a>
    <a class="quick-link-item" href="services.html"><span>⚙️</span> Services</a>
    <a class="quick-link-item" href="work.html"><span>📂</span> Portfolio</a>
    <a class="quick-link-item" href="pricing.html"><span>🏷️</span> Pricing</a>
  </div>

  <div class="btn-row">
    <a class="btn-primary" href="index.html">← Return to Homepage</a>
    <a class="btn-ghost-err" href="contact.html">Report Issue &amp; Contact →</a>
  </div>
</div>

<script src="app.js?v=20261025e"></script>
</body>
</html>
