name: Bug Report
description: Report a broken layout, link, or script error on the FIXIA website
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: Thank you for helping keep FIXIA fast, reliable, and bug-free!
  - type: input
    id: page_url
    attributes:
      label: Affected Page URL
      description: What page URL exhibited the issue?
      placeholder: e.g. /calculator.html, /solution-builder.html
    validations:
      required: true
  - type: textarea
    id: description
    attributes:
      label: Bug Description
      description: Clear and concise description of the bug.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to Reproduce
      description: How can maintainers reproduce the issue?
      placeholder: |
        1. Open '...'
        2. Click on '....'
        3. Observe error
    validations:
      required: true
  - type: input
    id: device_browser
    attributes:
      label: Device & Browser
      placeholder: e.g. Chrome 128 on macOS / Safari on iPhone 15
